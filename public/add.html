<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="title.add">הוספת מסעדה · מפת מסעדות כשרות</title>
<meta name="description" data-i18n-attr="content:desc.add" content="הוספת מסעדה בהשגחה למפת המסעדות הכשרות בישראל.">

<!-- First, so the language and direction are set before anything paints. -->
<script src="i18n.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="forms/form.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script type="module" src="forms/add.js"></script>
</head>
<body class="form-page">

<header id="topbar">
  <div class="brand">
    <h1 data-i18n="add.heading">הוספת מסעדה</h1>
  </div>
  <button type="button" class="lang-toggle" data-lang-toggle>English</button>
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-i18n="back">חזרה למפה</span>
  </a>
</header>

<main class="form-wrap">
  <form id="add-form" novalidate>
    <section id="section-main" class="section">
      <h2></h2>
    </section>

    <details id="section-advanced" class="section">
      <summary></summary>
      <div class="section-body"></div>
    </details>

    <!-- Bot trap: hidden from people and screen readers alike. -->
    <div class="hp" aria-hidden="true">
      <label>Company <input id="hp-input" type="text" tabindex="-1" autocomplete="off"></label>
    </div>

    <div id="captcha"></div>

    <p id="form-status" class="status" role="status" hidden></p>

    <button id="submit" type="submit" data-i18n="submit">שליחה</button>

    <p class="privacy" data-i18n="privacy"></p>
  </form>

  <section id="done" class="done" hidden>
    <h2 tabindex="-1"></h2>
    <p></p>
    <div class="done-actions">
      <a class="button" href="index.html" data-i18n="back">חזרה למפה</a>
      <button id="again" type="button" class="secondary" data-i18n="done.again">הוספת מסעדה נוספת</button>
    </div>
  </section>

</main>

</body>
</html>
