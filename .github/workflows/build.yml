name: Refresh data

on:
  schedule:
    # 03:00 UTC daily. Steady-state runs touch only changed records.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # To start the Pages deploy: a push made with this workflow's token does not
  # trigger other workflows (GitHub's rule), but a workflow_dispatch does.
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The first run geocodes ~641 addresses at 1 req/s; later runs take seconds.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dataset
        run: node scripts/build.mjs

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geocache.json data/community.json public/data/restaurants.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          # A long build can finish behind main if anything else landed
          # meanwhile, so rebase onto the remote before pushing.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "could not push refreshed data" >&2
          exit 1

      # Without this the refreshed data was committed but never published:
      # it went live only when some later code push happened to deploy it.
      - name: Publish the refreshed data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
